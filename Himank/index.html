<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathMatrix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <span class="logo">PathMatrix</span>
            <div class="hero">
                <div class="button" onclick="navigateTo('optimization', this)">Route Optimization</div>
                <div class="button" onclick="navigateTo('ridesharing', this)">Ride Sharing</div>
            </div>  
        </nav>
    </header>
    <main>
    <section id="welcome-view" class="page-section">
    <h1>Welcome to PathMatrix</h1>
    <p>Select a service from the navigation bar above to  begin optimizing routes or dynamic ride-sharing.</p>
    </section>

    <section id="optimization-view" class="page-section hidden">
    <h2>Part A: Route Optimization Dashboard</h2>
    </section>

    <section id="ridesharing-view" class="page-section hidden">
    <h2>Part B: Dynamic Ride Sharing Dashboard</h2>
    </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
